<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار الزخم - الشاشة المباشرة</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; padding: 15px; background: #1e1e1e; border-radius: 10px; border: 1px solid #333; }
        .market-health { font-size: 1.2em; font-weight: bold; padding: 10px; border-radius: 5px; display: inline-block; margin-top: 10px; }
        .status-bullish { background-color: rgba(0, 200, 83, 0.2); color: #00e676; border: 1px solid #00e676; }
        .status-bearish { background-color: rgba(213, 0, 0, 0.2); color: #ff1744; border: 1px solid #ff1744; }
        .status-neutral { background-color: rgba(255, 171, 0, 0.2); color: #ffd600; border: 1px solid #ffd600; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h2 { margin: 0 0 10px 0; color: #00e676; display: flex; justify-content: space-between; }
        .card p { margin: 5px 0; color: #ccc; font-size: 0.95em; }
        .badge { background: #333; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; color: #fff; }
        .pnl-positive { color: #00e676; font-weight: bold; }
        .pnl-negative { color: #ff1744; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 رادار الصفقات المباشر</h1>
        <div id="marketStatusEl" class="market-health status-neutral">حالة السوق: جاري الاتصال بالسيرفر...</div>
    </div>

    <div id="tradesContainer" class="grid">
        <!-- سيتم إضافة الصفقات هنا برمجياً -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات فايربيس الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyAH2hiXyrnxTDSa9vQJid8aFsryJk2jcHg",
          authDomain: "smartscanner-a5e0d.firebaseapp.com",
          projectId: "smartscanner-a5e0d",
          storageBucket: "smartscanner-a5e0d.firebasestorage.app",
          messagingSenderId: "976223541282",
          appId: "1:976223541282:web:a5dcfaeaaa99ac50f3127b"
        };

        // تهيئة الاتصال بفايربيس
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const marketStatusEl = document.getElementById('marketStatusEl');
        const tradesContainer = document.getElementById('tradesContainer');

        // 1. الاستماع لحالة السوق من السيرفر
        onSnapshot(doc(db, "momentum_system_logs", "market_health"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                marketStatusEl.className = `market-health status-${data.status}`;
                marketStatusEl.innerHTML = `حالة السوق: ${data.status.toUpperCase()} (${data.score}%)`;
            }
        });

        // 2. الاستماع للصفقات النشطة والمغلقة من السيرفر
        onSnapshot(collection(db, "momentum_trades_v1"), (snapshot) => {
            tradesContainer.innerHTML = ''; 
            
            if (snapshot.empty) {
                tradesContainer.innerHTML = '<p style="text-align:center; width:100%; color:#888;">لا توجد صفقات حالياً. السيرفر يراقب السوق في الخلفية...</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const trade = docSnap.data();
                
                let pnlValue = trade.pnl || 0;
                if(trade.status === 'open' && trade.currentPrice) {
                    pnlValue = ((trade.currentPrice - trade.entryPrice) / trade.entryPrice) * 100;
                }
                
                const pnlClass = pnlValue >= 0 ? 'pnl-positive' : 'pnl-negative';
                const statusColor = trade.status === 'open' ? '#ffd600' : (pnlValue > 0 ? '#00e676' : '#ff1744');

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h2>
                        ${trade.symbol} 
                        <span style="color: ${statusColor}; font-size: 0.7em;">● ${trade.status.toUpperCase()}</span>
                    </h2>
                    <p>الاستراتيجية: <span class="badge">${trade.strategy}</span></p>
                    <p>سعر الدخول: ${trade.entryPrice}</p>
                    <p>السعر الحالي: ${trade.currentPrice || trade.entryPrice}</p>
                    <p>الربح / الخسارة: <span class="${pnlClass}">${pnlValue.toFixed(2)}%</span></p>
                    <p>تقييم الدخول: ${trade.entryScore || 0}/100</p>
                `;
                tradesContainer.appendChild(card);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار ترند العملات الرقمية | VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        brand: {
                            green: '#10B981',
                            red: '#EF4444',
                            blue: '#3B82F6',
                            gold: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #030712; 
            color: #f3f4f6; 
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111827;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        
        @keyframes shine {
            to { background-position-x: -200%; }
        }
        .skeleton {
            background: #1f2937;
            background: linear-gradient(110deg, #1f2937 8%, #374151 18%, #1f2937 33%);
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }

        @keyframes flashGreen {
            0% { background-color: rgba(16, 185, 129, 0.25); }
            100% { background-color: transparent; }
        }
        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.25); }
            100% { background-color: transparent; }
        }
        .update-green { animation: flashGreen 1s ease-out; }
        .update-red { animation: flashRed 1s ease-out; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-gray-900 border-b border-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14 sm:h-16">
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="w-7 h-7 sm:w-8 sm:h-8 rounded bg-gradient-to-bl from-brand-blue to-purple-600 flex items-center justify-center text-white font-bold shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/></svg>
                    </div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">رادار الكريبتو <span class="text-[10px] sm:text-xs font-normal text-gray-400 mr-1 hidden sm:inline">بيانات باينانس الحية</span></h1>
                </div>
                <div class="flex items-center gap-2">
                    <div id="status-indicator" class="flex items-center gap-1.5 text-[10px] sm:text-xs text-gray-400 bg-gray-800 px-2 sm:px-3 py-1 sm:py-1.5 rounded-full border border-gray-700">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-green opacity-75 hidden" id="status-ping"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-gray-500" id="status-dot"></span>
                        </span>
                        <span id="status-text">جاري الاتصال...</span>
                    </div>
                    
                    <!-- زرار التنبيه الصوتي -->
                    <button id="sound-toggle-btn" class="p-1.5 sm:p-2 text-gray-500 hover:text-white hover:bg-gray-800 rounded-lg transition-colors relative group" title="تفعيل التنبيهات الصوتية">
                        <svg id="sound-icon-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                        <svg id="sound-icon-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden text-brand-gold"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="absolute top-full left-1/2 -translate-x-1/2 mt-2 px-2 py-1 bg-gray-800 text-[10px] text-white rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none z-50">تفعيل الصوت</span>
                    </button>

                    <button id="refresh-btn" class="p-1.5 sm:p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-2 sm:px-4 lg:px-8 py-3 sm:py-6 flex flex-col gap-3 sm:gap-6">
        
        <!-- Controls Section -->
        <section class="bg-gray-900 rounded-xl border border-gray-800 p-3 sm:p-5 shadow-lg">
            <div class="flex flex-col lg:flex-row gap-4 sm:gap-6 justify-between">
                
                <!-- Filters -->
                <div class="flex-1 space-y-3">
                    <h2 class="text-[11px] sm:text-sm font-semibold text-gray-400 uppercase tracking-wider">أدوات الفلترة والبحث</h2>
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 sm:gap-4">
                        
                        <!-- Search -->
                        <div class="space-y-1 sm:space-y-1.5 col-span-2 lg:col-span-1">
                            <label for="search-input" class="text-[10px] sm:text-xs text-gray-400">ابحث عن عملة</label>
                            <input type="text" id="search-input" placeholder="مثال: BTC, SOL..." class="block w-full px-3 py-1.5 sm:py-2 border border-gray-700 rounded-lg bg-gray-800 text-gray-300 placeholder-gray-500 focus:outline-none focus:border-brand-blue text-xs sm:text-sm dir-ltr text-left">
                        </div>

                        <!-- Strategy -->
                        <div class="space-y-1 sm:space-y-1.5 col-span-2 lg:col-span-1">
                            <label for="strategy-select" class="text-[10px] sm:text-xs text-brand-gold font-bold flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                رادار الصيد (استراتيجيات)
                            </label>
                            <select id="strategy-select" class="block w-full px-2 py-1.5 sm:py-2 text-[11px] sm:text-sm border-brand-gold border-opacity-40 focus:outline-none focus:border-brand-gold rounded-lg bg-gray-800 text-gray-200">
                                <option value="none" selected>بدون استراتيجية (عرض الكل)</option>
                                <optgroup label="🔥 استراتيجيات قبل الانفجار (استباقية)">
                                    <option value="squeeze_breakout">🧲 ضغط وتجميع (جاهزة للكسر)</option>
                                    <option value="whale_wick">🐋 رفض الهبوط (ذيل الحوت)</option>
                                    <option value="stealth_money">🕵️‍♂️ سيولة مخفية (تجميع حيتان)</option>
                                </optgroup>
                                <optgroup label="⚡ استراتيجيات الزخم (الملاحقة)">
                                    <option value="pre_pump">🚀 بداية صعود قوي</option>
                                    <option value="momentum_pro">📈 انفجار الزخم (Momentum Pro)</option>
                                </optgroup>
                            </select>
                        </div>

                        <!-- Volume Filter -->
                        <div class="space-y-1 sm:space-y-1.5">
                            <label for="min-volume" class="text-[10px] sm:text-xs text-gray-400">السيولة (الفوليوم)</label>
                            <select id="min-volume" class="block w-full px-2 py-1.5 sm:py-2 text-[11px] sm:text-sm border-gray-700 focus:outline-none focus:border-brand-blue rounded-lg bg-gray-800 text-gray-300">
                                <option value="0">الكل</option>
                                <option value="5000000">+5 مليون$</option>
                                <option value="10000000" selected>+10 مليون$</option>
                                <option value="50000000">+50 مليون$</option>
                            </select>
                        </div>

                        <!-- Trend Direction -->
                        <div class="space-y-1 sm:space-y-1.5">
                            <label for="trend-filter" class="text-[10px] sm:text-xs text-gray-400">الاتجاه</label>
                            <select id="trend-filter" class="block w-full px-2 py-1.5 sm:py-2 text-[11px] sm:text-sm border-gray-700 focus:outline-none focus:border-brand-blue rounded-lg bg-gray-800 text-gray-300">
                                <option value="all" selected>الكل</option>
                                <option value="bullish">صاعد (+)</option>
                                <option value="bearish">هابط (-)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="hidden lg:block w-px bg-gray-800"></div>

                <!-- Sorting -->
                <div class="flex flex-col space-y-2 sm:space-y-3 lg:w-48">
                     <h2 class="text-[11px] sm:text-sm font-semibold text-gray-400 uppercase tracking-wider">ترتيب حسب</h2>
                     <select id="sort-select" class="block w-full px-2 py-1.5 sm:py-2 text-[11px] sm:text-sm border-gray-700 focus:outline-none focus:border-brand-blue rounded-lg bg-gray-800 text-gray-300">
                        <option value="changeDesc" selected>الأكثر صعوداً</option>
                        <option value="changeAsc">الأكثر هبوطاً</option>
                        <option value="volDesc">الأعلى سيولة</option>
                    </select>
                    
                    <div class="flex justify-between items-center mt-auto pt-1">
                        <span class="text-[9px] sm:text-xs text-gray-500" id="last-update-time">في انتظار البيانات...</span>
                        <span class="text-[9px] sm:text-xs bg-gray-800 text-gray-300 px-1.5 py-0.5 rounded border border-gray-700" id="pair-count">0 عملة</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Data Table Section -->
        <section class="bg-gray-900 rounded-xl border border-gray-800 shadow-xl overflow-hidden flex-1 flex flex-col min-h-[400px]">
            <div class="overflow-x-auto custom-scrollbar flex-1 relative">
                <table class="min-w-full divide-y divide-gray-800 text-right">
                    <thead class="bg-gray-850 sticky top-0 z-10 shadow-sm text-[11px] sm:text-xs lg:text-sm">
                        <tr>
                            <th scope="col" class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 font-semibold text-gray-300">العملة</th>
                            <th scope="col" class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 font-semibold text-gray-300 text-left">السعر (USDT)</th>
                            <th scope="col" class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 font-semibold text-gray-300 text-left">التغير</th>
                            <th scope="col" class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 font-semibold text-gray-300 text-left hidden lg:table-cell">السيولة</th>
                            <th scope="col" class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 font-semibold text-gray-300 text-center">أكشن</th>
                        </tr>
                    </thead>
                    <tbody id="crypto-table-body" class="divide-y divide-gray-800/50 bg-gray-900">
                        <!-- Loading Skeletons -->
                        <tr class="animate-pulse">
                            <td class="px-2 sm:px-4 py-3"><div class="h-4 bg-gray-800 rounded w-16 skeleton"></div></td>
                            <td class="px-2 sm:px-4 py-3"><div class="h-4 bg-gray-800 rounded w-12 mr-auto skeleton"></div></td>
                            <td class="px-2 sm:px-4 py-3"><div class="h-4 bg-gray-800 rounded w-10 mr-auto skeleton"></div></td>
                            <td class="px-2 sm:px-4 py-3 hidden lg:table-cell"><div class="h-4 bg-gray-800 rounded w-20 mr-auto skeleton"></div></td>
                            <td class="px-2 sm:px-4 py-3"><div class="h-6 bg-gray-800 rounded w-12 mx-auto skeleton"></div></td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Empty State -->
                <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-20 p-4 text-center">
                    <svg class="h-10 w-10 sm:h-12 sm:w-12 text-gray-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <h3 class="text-sm sm:text-base font-medium text-gray-300">مفيش عملات تطابق الشروط دي حالياً</h3>
                    <p class="text-[10px] sm:text-xs text-gray-500 mt-1">جرب تغير الاستراتيجية أو تقلل فلتر السيولة.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- State Management ---
        let allCryptoData = [];       
        let previousPrices = {};      
        let previousFilteredSymbols = new Set(); 
        let isFirstLoad = true;
        let updateInterval;
        let soundEnabled = false;
        let synth = null;
        
        const BINANCE_API_URL = 'https://api.binance.com/api/v3/ticker/24hr';
        const TARGET_QUOTE_ASSET = 'USDT'; 
        const REFRESH_RATE_MS = 10000;     

        // DOM Elements
        const tableBody = document.getElementById('crypto-table-body');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const minVolumeSelect = document.getElementById('min-volume');
        const trendFilterSelect = document.getElementById('trend-filter');
        const sortSelect = document.getElementById('sort-select');
        const strategySelect = document.getElementById('strategy-select'); 
        const pairCountSpan = document.getElementById('pair-count');
        const lastUpdateTimeSpan = document.getElementById('last-update-time');
        const refreshBtn = document.getElementById('refresh-btn');
        const statusDot = document.getElementById('status-dot');
        const statusPing = document.getElementById('status-ping');
        const statusText = document.getElementById('status-text');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const soundIconOff = document.getElementById('sound-icon-off');
        const soundIconOn = document.getElementById('sound-icon-on');

        // Formats
        const formatPrice = (priceStr) => {
            const price = parseFloat(priceStr);
            if (isNaN(price)) return '0.00';
            if (price < 0.0001) return price.toPrecision(4);
            if (price < 1) return price.toFixed(4);
            if (price < 10) return price.toFixed(3);
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const formatNumberShort = (numStr) => {
            const num = parseFloat(numStr);
            if (isNaN(num)) return '0';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            return num.toFixed(0);
        };

        const getBaseAsset = (symbol) => symbol.replace(TARGET_QUOTE_ASSET, '');

        // --- نظام التنبيه الصوتي ---
        const playAlertSound = () => {
            if (!soundEnabled) return;
            try {
                if (!synth) {
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
                    }).toDestination();
                }
                // رنة خفيفة مش مزعجة
                const now = Tone.now();
                synth.triggerAttackRelease("E5", "16n", now);
                synth.triggerAttackRelease("G5", "16n", now + 0.15);
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        const toggleSound = async () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                await Tone.start(); 
                soundIconOff.classList.add('hidden');
                soundIconOn.classList.remove('hidden');
                soundToggleBtn.classList.add('bg-brand-gold', 'bg-opacity-10');
                playAlertSound(); 
            } else {
                soundIconOff.classList.remove('hidden');
                soundIconOn.classList.add('hidden');
                soundToggleBtn.classList.remove('bg-brand-gold', 'bg-opacity-10');
            }
        };

        soundToggleBtn.addEventListener('click', toggleSound);

        const setStatus = (status) => {
            if (status === 'connected') {
                statusDot.className = 'relative inline-flex rounded-full h-2 w-2 bg-brand-green';
                statusPing.classList.remove('hidden');
                statusText.innerText = 'متصل';
            } else if (status === 'error') {
                statusDot.className = 'relative inline-flex rounded-full h-2 w-2 bg-brand-red';
                statusPing.classList.add('hidden');
                statusText.innerText = 'خطأ';
            } else {
                statusDot.className = 'relative inline-flex rounded-full h-2 w-2 bg-gray-500';
                statusPing.classList.add('hidden');
                statusText.innerText = 'تحديث...';
            }
        };

        const fetchMarketData = async () => {
            if(!isFirstLoad) setStatus('fetching');
            try {
                const response = await fetch(BINANCE_API_URL);
                if (!response.ok) throw new Error(`HTTP error!`);
                const data = await response.json();
                
                allCryptoData = data
                    .filter(item => item.symbol.endsWith(TARGET_QUOTE_ASSET) && parseFloat(item.quoteVolume) > 0)
                    .map(item => {
                        const changePct = parseFloat(item.priceChangePercent);
                        return {
                            symbol: item.symbol,
                            baseAsset: getBaseAsset(item.symbol),
                            price: parseFloat(item.lastPrice),
                            changePercent: changePct,
                            high: parseFloat(item.highPrice),
                            low: parseFloat(item.lowPrice),
                            volume: parseFloat(item.quoteVolume), 
                            isBullish: changePct >= 0,
                            avgPrice: parseFloat(item.weightedAvgPrice)
                        };
                    });

                renderTable();
                setStatus('connected');
                const now = new Date();
                lastUpdateTimeSpan.innerText = `تحديث: ${now.toLocaleTimeString('ar-EG')}`;
                if (isFirstLoad) isFirstLoad = false;
            } catch (error) {
                setStatus('error');
            }
        };

        const renderTable = () => {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const minVol = parseFloat(minVolumeSelect.value);
            const trendDirection = trendFilterSelect.value;
            const sortBy = sortSelect.value;
            const strategy = strategySelect.value; 

            let filteredData = allCryptoData.filter(item => {
                if (!item.baseAsset.toLowerCase().includes(searchTerm)) return false;
                if (item.volume < minVol) return false;
                if (trendDirection === 'bullish' && !item.isBullish) return false;
                if (trendDirection === 'bearish' && item.isBullish) return false;

                const dailyRange = item.high - item.low;
                const rangePercent = (dailyRange / item.low) * 100;
                
                // --- استراتيجيات قبل الانفجار ---
                
                if (strategy === 'squeeze_breakout') {
                    // 1. تجميع وحشر (Volatility Squeeze)
                    if (rangePercent > 6) return false;
                    const positionFromBottom = (item.price - item.low) / dailyRange;
                    if (positionFromBottom < 0.85) return false;
                    if (item.changePercent < -1 || item.changePercent > 3) return false;
                }

                if (strategy === 'whale_wick') {
                    // 2. ذيل الحوت (رفض الهبوط بقوة)
                    if (dailyRange === 0) return false;
                    const bouncePercent = ((item.price - item.low) / item.low) * 100;
                    if (bouncePercent < 4) return false;
                    if (item.price <= item.avgPrice) return false;
                    if (item.changePercent > 2) return false;
                }

                if (strategy === 'stealth_money') {
                    // 3. سيولة مخفية
                    if (item.volume < 30000000) return false;
                    if (item.changePercent < 0 || item.changePercent > 3.5) return false;
                    if (item.price <= item.avgPrice) return false;
                }

                // --- استراتيجيات الزخم ---

                if (strategy === 'pre_pump') {
                    if (item.changePercent < 0.5 || item.changePercent > 6) return false;
                    if (item.price <= item.avgPrice) return false;
                    const distanceToHigh = (item.high - item.price) / item.high;
                    if (distanceToHigh > 0.04) return false;
                }

                if (strategy === 'momentum_pro') {
                    if (item.changePercent < 2 || item.changePercent > 15) return false;
                    if (item.price <= item.avgPrice) return false;
                    if (dailyRange === 0) return false;
                    const pricePosition = (item.price - item.low) / dailyRange; 
                    if (pricePosition < 0.70) return false; 
                }

                return true;
            });

            filteredData.sort((a, b) => {
                if (sortBy === 'changeDesc') return b.changePercent - a.changePercent;
                if (sortBy === 'changeAsc') return a.changePercent - b.changePercent;
                if (sortBy === 'volDesc') return b.volume - a.volume;
                return b.changePercent - a.changePercent;
            });

            // --- فحص الفرص الجديدة لتشغيل التنبيه ---
            const currentSymbols = new Set(filteredData.map(item => item.symbol));
            let newCoinFound = false;
            
            // بنشغل الصوت لو مختارين استراتيجية، ولقينا عملة جديدة دخلت في القايمة
            if (!isFirstLoad && strategy !== 'none') {
                for (const symbol of currentSymbols) {
                    if (!previousFilteredSymbols.has(symbol)) {
                        newCoinFound = true;
                        break;
                    }
                }
                if (newCoinFound) {
                    playAlertSound();
                }
            }
            previousFilteredSymbols = currentSymbols;
            // --------------------------------------

            pairCountSpan.innerText = `${filteredData.length} عملة`;

            if (filteredData.length === 0) {
                tableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            const displayData = filteredData.slice(0, 100); 
            
            let html = '';
            displayData.forEach(item => {
                const prevPrice = previousPrices[item.symbol];
                let rowAnim = '';
                if (!isFirstLoad && prevPrice) {
                    if (item.price > prevPrice) rowAnim = 'update-green';
                    else if (item.price < prevPrice) rowAnim = 'update-red';
                }
                previousPrices[item.symbol] = item.price;

                const isBull = item.isBullish;
                const colorClass = isBull ? 'text-brand-green' : 'text-brand-red';
                
                let highlightBg = 'hover:bg-gray-800';
                if(strategySelect.value !== 'none') {
                    highlightBg = 'bg-brand-blue bg-opacity-5 hover:bg-opacity-10 border-l-2 border-brand-blue';
                }

                html += `
                    <tr class="${highlightBg} transition-colors border-b border-gray-800/50 ${rowAnim}">
                        <td class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="font-bold text-white text-[11px] sm:text-sm dir-ltr">${item.baseAsset}</div>
                            </div>
                        </td>
                        <td class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 whitespace-nowrap text-left font-mono text-[11px] sm:text-sm text-gray-100 dir-ltr">
                            $${formatPrice(item.price)}
                        </td>
                        <td class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 whitespace-nowrap text-left font-medium text-[11px] sm:text-sm ${colorClass} dir-ltr">
                            ${isBull ? '+' : ''}${item.changePercent.toFixed(2)}%
                        </td>
                        <td class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 whitespace-nowrap text-left hidden lg:table-cell font-mono text-[11px] sm:text-sm text-gray-400 dir-ltr">
                            $${formatNumberShort(item.volume)}
                        </td>
                        <td class="px-2 sm:px-4 lg:px-6 py-2 sm:py-3 whitespace-nowrap text-center">
                            <a href="https://www.binance.com/ar/trade/${item.symbol}" target="_blank" class="inline-flex items-center justify-center px-2 sm:px-3 py-1 bg-gray-800 hover:bg-brand-blue text-white text-[10px] sm:text-xs rounded border border-gray-700 transition-colors">
                                تداول
                            </a>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        };

        // Listeners
        ['input', 'change'].forEach(evt => {
            searchInput.addEventListener(evt, renderTable);
            minVolumeSelect.addEventListener(evt, renderTable);
            trendFilterSelect.addEventListener(evt, renderTable);
            sortSelect.addEventListener(evt, renderTable);
            strategySelect.addEventListener(evt, renderTable);
        });

        refreshBtn.addEventListener('click', () => {
            const svg = refreshBtn.querySelector('svg');
            svg.classList.add('animate-spin');
            fetchMarketData().then(() => setTimeout(() => svg.classList.remove('animate-spin'), 500));
            clearInterval(updateInterval);
            updateInterval = setInterval(fetchMarketData, REFRESH_RATE_MS);
        });

        const initApp = () => {
            fetchMarketData();
            updateInterval = setInterval(fetchMarketData, REFRESH_RATE_MS);
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    clearInterval(updateInterval);
                    setStatus('fetching');
                } else {
                    fetchMarketData(); 
                    updateInterval = setInterval(fetchMarketData, REFRESH_RATE_MS);
                }
            });
        };

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

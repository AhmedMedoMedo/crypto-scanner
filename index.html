<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار ترند العملات الرقمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        brand: {
                            green: '#10B981',
                            red: '#EF4444',
                            blue: '#3B82F6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #030712; /* gray-950 */
            color: #f3f4f6; /* gray-100 */
        }
        
        /* Custom scrollbar for the table container */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111827;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4B5563;
        }

        /* Shine animation for loading skeletons */
        @keyframes shine {
            to {
                background-position-x: -200%;
            }
        }
        .skeleton {
            background: #1f2937;
            background: linear-gradient(110deg, #1f2937 8%, #374151 18%, #1f2937 33%);
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }

        /* Pulse animation for live updates */
        @keyframes flashGreen {
            0% { background-color: rgba(16, 185, 129, 0.2); }
            100% { background-color: transparent; }
        }
        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.2); }
            100% { background-color: transparent; }
        }
        .update-green {
            animation: flashGreen 1s ease-out;
        }
        .update-red {
            animation: flashRed 1s ease-out;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-gray-900 border-b border-gray-800 shadow-sm">

            <div class="flex items-center justify-between h-16">

                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight text-white">رادار الكريبتو <span class="text-xs font-normal text-gray-400 mr-1 hidden sm:inline">بيانات باينانس المباشرة</span></h1>
                </div>
                <div class="flex items-center gap-2 sm:gap-4">

                            <span class="relative inline-flex rounded-full h-2 w-2 sm:h-3 sm:w-3 bg-gray-500" id="status-dot"></span>
                        </span>
                        <span id="status-text" class="hidden sm:inline">غير متصل</span>
                    </div>
                    <button id="refresh-btn" class="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors" title="تحديث البيانات فوراً">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>

            </div>

    <main class="flex-1 max-w-7xl mx-auto w-full px-2 sm:px-4 lg:px-8 py-4 sm:py-6 flex flex-col gap-4 sm:gap-6">

        </section>

        <!-- Data Table Section -->
        <section class="bg-gray-900 rounded-xl border border-gray-800 shadow-xl overflow-hidden flex-1 flex flex-col min-h-[500px]">
            <div class="overflow-x-auto custom-scrollbar flex-1 relative">

                    <thead class="bg-gray-850 sticky top-0 z-10 shadow-sm">

                            <td class="px-3 sm:px-6 py-3 sm:py-4 hidden lg:table-cell"><div class="h-4 bg-gray-800 rounded w-16 mx-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4"><div class="h-8 bg-gray-800 rounded w-12 sm:w-16 mx-auto skeleton"></div></td>
                        </tr>
                         <tr class="animate-pulse border-b border-gray-800">
                            <td class="px-3 sm:px-6 py-3 sm:py-4"><div class="h-4 bg-gray-800 rounded w-14 sm:w-20 skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4"><div class="h-4 bg-gray-800 rounded w-16 sm:w-24 mr-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4"><div class="h-4 bg-gray-800 rounded w-10 sm:w-12 mr-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4 hidden sm:table-cell"><div class="h-4 bg-gray-800 rounded w-20 mr-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4 hidden md:table-cell"><div class="h-4 bg-gray-800 rounded w-24 mr-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4 hidden lg:table-cell"><div class="h-4 bg-gray-800 rounded w-12 mx-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4"><div class="h-8 bg-gray-800 rounded w-12 sm:w-16 mx-auto skeleton"></div></td>
                        </tr>
                         <tr class="animate-pulse">
                            <td class="px-3 sm:px-6 py-3 sm:py-4"><div class="h-4 bg-gray-800 rounded w-20 sm:w-28 skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4"><div class="h-4 bg-gray-800 rounded w-10 sm:w-16 mr-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4"><div class="h-4 bg-gray-800 rounded w-14 sm:w-20 mr-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4 hidden sm:table-cell"><div class="h-4 bg-gray-800 rounded w-28 mr-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4 hidden md:table-cell"><div class="h-4 bg-gray-800 rounded w-20 mr-auto skeleton"></div></td>
                            <td class="px-3 sm:px-6 py-3 sm:py-4 hidden lg:table-cell"><div class="h-4 bg-gray-800 rounded w-20 mx-auto skeleton"></div></td>

                <!-- Empty State (Hidden by default) -->

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <h3 class="text-lg font-medium text-gray-300">لا توجد عملات تطابق بحثك</h3>
                    <p class="text-sm text-gray-500 mt-1">حاول تغيير شروط البحث أو الفلاتر.</p>
                    <button id="reset-filters-btn" class="mt-4 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg transition-colors border border-gray-700">إعادة ضبط الفلاتر</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- State Management ---
        let allCryptoData = [];       // Raw data from Binance API
        let previousPrices = {};      // For highlighting price changes (green/red flash)
        let isFirstLoad = true;
        let updateInterval;
        
        // Configuration
        const BINANCE_API_URL = 'https://api.binance.com/api/v3/ticker/24hr';
        const TARGET_QUOTE_ASSET = 'USDT'; // Only look at USDT pairs to keep it manageable and relatable
        const REFRESH_RATE_MS = 10000;     // Fetch new REST data every 10 seconds

        // DOM Elements
        const tableBody = document.getElementById('crypto-table-body');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const minVolumeSelect = document.getElementById('min-volume');
        const trendFilterSelect = document.getElementById('trend-filter');
        const sortSelect = document.getElementById('sort-select');
        const strategySelect = document.getElementById('strategy-select'); // Added strategy select
        const pairCountSpan = document.getElementById('pair-count');
        const lastUpdateTimeSpan = document.getElementById('last-update-time');
        const refreshBtn = document.getElementById('refresh-btn');
        const resetFiltersBtn = document.getElementById('reset-filters-btn');
        
        // Status Elements
        const statusDot = document.getElementById('status-dot');
        const statusPing = document.getElementById('status-ping');
        const statusText = document.getElementById('status-text');

        // --- Utility Formatters ---
        
        // Format price intelligently based on magnitude
        const formatPrice = (priceStr) => {
            const price = parseFloat(priceStr);
            if (isNaN(price)) return '0.00';
            
            if (price < 0.0001) return price.toPrecision(4);
            if (price < 1) return price.toFixed(4);
            if (price < 10) return price.toFixed(3);
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        // Format large numbers (Volumes, Market Caps)
        const formatNumberShort = (numStr) => {
            const num = parseFloat(numStr);
            if (isNaN(num)) return '0';
            
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return num.toFixed(0);
        };

        // Get base asset from symbol (e.g., "BTC" from "BTCUSDT")
        const getBaseAsset = (symbol) => {
            return symbol.replace(TARGET_QUOTE_ASSET, '');
        };

        // --- Core Logic ---

        // Calculate a custom "Trend Score" based on momentum and volume
        // Range roughly 0 to 100+
        const calculateTrendScore = (changePercent, volume, isBullish) => {
            const absChange = Math.abs(parseFloat(changePercent));
            const vol = parseFloat(volume);
            
            // Base score from pure percentage movement (capped at 50 to prevent outliers skewing too hard)
            let score = Math.min(absChange * 2, 50);
            
            // Volume multiplier: reward high liquidity moves
            let volMultiplier = 1;
            if (vol > 100000000) volMultiplier = 1.5; // > $100M
            else if (vol > 50000000) volMultiplier = 1.3; // > $50M
            else if (vol > 10000000) volMultiplier = 1.1; // > $10M
            else if (vol < 1000000) volMultiplier = 0.5;  // Penalize low volume shitcoins
            
            score = score * volMultiplier;
            
            // Make score directional if needed for display, but here we return absolute magnitude
            // We'll style it green/red based on the changePercent later
            return parseFloat(score.toFixed(1));
        };

        // Set Connection Status UI
        const setStatus = (status) => {
            if (status === 'connected') {
                statusDot.classList.remove('bg-gray-500', 'bg-brand-red');
                statusDot.classList.add('bg-brand-green');
                statusPing.classList.remove('hidden');
                statusPing.classList.add('bg-brand-green');
                statusText.innerText = 'متصل (بيانات حية)';
                statusText.classList.remove('text-gray-400', 'text-brand-red');
                statusText.classList.add('text-brand-green');
            } else if (status === 'error') {
                statusDot.classList.remove('bg-gray-500', 'bg-brand-green');
                statusDot.classList.add('bg-brand-red');
                statusPing.classList.add('hidden');
                statusText.innerText = 'خطأ في الاتصال';
                statusText.classList.remove('text-gray-400', 'text-brand-green');
                statusText.classList.add('text-brand-red');
            } else {
                statusDot.classList.remove('bg-brand-green', 'bg-brand-red');
                statusDot.classList.add('bg-gray-500');
                statusPing.classList.add('hidden');
                statusText.innerText = 'جاري التحديث...';
                statusText.classList.remove('text-brand-green', 'text-brand-red');
                statusText.classList.add('text-gray-400');
            }
        };

        // Fetch data from Binance REST API
        const fetchMarketData = async () => {
            if(!isFirstLoad) setStatus('fetching');
            
            try {
                const response = await fetch(BINANCE_API_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                // Filter only TARGET_QUOTE_ASSET pairs (e.g., USDT) and active trading pairs
                const processedData = data
                    .filter(item => item.symbol.endsWith(TARGET_QUOTE_ASSET) && parseFloat(item.volume) > 0)
                    .map(item => {
                        const changePct = parseFloat(item.priceChangePercent);
                        const isBullish = changePct >= 0;
                        const quoteVolume = parseFloat(item.quoteVolume);
                        
                        return {
                            symbol: item.symbol,
                            baseAsset: getBaseAsset(item.symbol),
                            price: item.lastPrice,
                            changePercent: changePct,
                            high: item.highPrice,
                            low: item.lowPrice,
                            volume: quoteVolume, // Use quote volume (USDT value) for easier comparison
                            isBullish: isBullish,
                            trendScore: calculateTrendScore(changePct, quoteVolume, isBullish),
                            rawItem: item // keep raw data just in case
                        };
                    });

                allCryptoData = processedData;
                renderTable();
                
                setStatus('connected');
                
                const now = new Date();
                lastUpdateTimeSpan.innerText = `آخر تحديث: ${now.toLocaleTimeString('ar-EG')}`;
                
                if (isFirstLoad) isFirstLoad = false;

            } catch (error) {
                console.error("Error fetching crypto data:", error);
                setStatus('error');
                // Don't clear data on error, keep showing old data
                if (isFirstLoad) {
                    tableBody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-brand-red">فشل في تحميل البيانات. يرجى التحقق من اتصالك بالإنترنت.</td></tr>`;
                }
            }
        };

        // --- Rendering Logic ---

        const getStatusColorClass = (isBullish) => {
            return isBullish ? 'text-brand-green' : 'text-brand-red';
        };

        const renderTable = () => {
            // 1. Get filter values
            const searchTerm = searchInput.value.toLowerCase().trim();
            const minVol = parseFloat(minVolumeSelect.value);
            const trendDirection = trendFilterSelect.value;
            const sortBy = sortSelect.value;
            const strategy = strategySelect.value; // Get strategy value

            // 2. Filter the data
            let filteredData = allCryptoData.filter(item => {
                // Search filter
                const matchesSearch = item.baseAsset.toLowerCase().includes(searchTerm) || 
                                      item.symbol.toLowerCase().includes(searchTerm);
                if (!matchesSearch) return false;

                // Volume filter
                if (item.volume < minVol) return false;

                // Trend direction filter
                if (trendDirection === 'bullish' && !item.isBullish) return false;
                if (trendDirection === 'bearish' && item.isBullish) return false;

                // Strategy filter
                if (strategy === 'pre_pump') {
                    const lastPrice = parseFloat(item.price);
                    const avgPrice = parseFloat(item.rawItem.weightedAvgPrice);
                    const highPrice = parseFloat(item.high);
                    
                    // شروط ما قبل الانفجار:
                    // 1. العملة إيجابية بس لسة مطارتش (تغيير من 0.5% لـ 6%)
                    if (item.changePercent < 0.5 || item.changePercent > 6) return false;
                    
                    // 2. زخم إيجابي: السعر الحالي أعلى من متوسط سعر اليوم (في شراء بيحصل دلوقتي)
                    if (lastPrice <= avgPrice) return false;
                    
                    // 3. بتضغط على المقاومة: السعر قريب من أعلى قمة جابها النهاردة (أقل من 4% مسافة للقمة)
                    const distanceToHigh = (highPrice - lastPrice) / highPrice;
                    if (distanceToHigh > 0.04) return false;
                }
                
                if (strategy === 'bottom_bounce') {
                    const lastPrice = parseFloat(item.price);
                    const lowPrice = parseFloat(item.low);
                    
                    // شروط الارتداد من القاع:
                    // 1. العملة لسة حمرا في الـ 24 ساعة (عشان نشتري من تحت)
                    if (item.changePercent >= 0) return false;
                    
                    // 2. بس السعر الحالي طلع بنسبة 3% على الأقل من أقل سعر جابه النهاردة (يعني في حيتان اشترت من القاع)
                    const bounceFromLow = (lastPrice - lowPrice) / lowPrice;
                    if (bounceFromLow < 0.03) return false;
                }

                if (strategy === 'momentum_pro') {
                    const lastPrice = parseFloat(item.price);
                    const lowPrice = parseFloat(item.low);
                    const highPrice = parseFloat(item.high);
                    const avgPrice = parseFloat(item.rawItem.weightedAvgPrice);
                    
                    // تحويل شروط كود Pine Script لبيانات الرادار (24 ساعة):
                    
                    // 1. (RSI > 55 and RSI < 85) -> السعر صاعد بقوة بس لسه مجابش آخره (من 2% لـ 15%)
                    if (item.changePercent < 2 || item.changePercent > 15) return false;
                    
                    // 2. (EMA 9 > EMA 21) & (Close > Open) -> السعر الحالي أعلى من متوسط تداول اليوم
                    if (lastPrice <= avgPrice) return false;
                    
                    // 3. (Close > EMA 9) -> السعر متماسك فوق ومش بينزل، يعني في أعلى 30% من الشمعة اليومية
                    const dailyRange = highPrice - lowPrice;
                    if (dailyRange === 0) return false;
                    
                    const pricePosition = (lastPrice - lowPrice) / dailyRange; // رقم بين 0 و 1
                    if (pricePosition < 0.70) return false; // لازم يكون محافظ على 70% من الصعود اليومي
                }

                return true;
            });

            // 3. Sort the data
            filteredData.sort((a, b) => {
                switch (sortBy) {
                    case 'changeDesc': // Top Gainers
                        return b.changePercent - a.changePercent;
                    case 'changeAsc':  // Top Losers
                        return a.changePercent - b.changePercent;
                    case 'volDesc':    // Highest Volume
                        return b.volume - a.volume;
                    case 'scoreDesc':  // Highest Trend Score
                        return b.trendScore - a.trendScore;
                    default:
                        return b.changePercent - a.changePercent;
                }
            });

            // Update pair count
            pairCountSpan.innerText = `${filteredData.length} عملة`;

            // 4. Render HTML
            if (filteredData.length === 0) {
                tableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            
            // Limit to top 150 to keep DOM fast
            const displayData = filteredData.slice(0, 150);
            
            let html = '';
            displayData.forEach(item => {
                const priceFormatted = formatPrice(item.price);
                const prevPrice = previousPrices[item.symbol];
                let rowAnimationClass = '';
                
                // Add flash animation if price changed since last tick (skip on first load)
                if (!isFirstLoad && prevPrice) {
                    if (parseFloat(item.price) > prevPrice) {
                        rowAnimationClass = 'update-green';
                    } else if (parseFloat(item.price) < prevPrice) {
                        rowAnimationClass = 'update-red';
                    }
                }
                
                // Save current price for next comparison
                previousPrices[item.symbol] = parseFloat(item.price);

                const changeSign = item.isBullish ? '+' : '';
                const colorClass = getStatusColorClass(item.isBullish);
                const scoreColorClass = item.trendScore > 20 ? (item.isBullish ? 'bg-brand-green bg-opacity-20 text-brand-green border-brand-green border-opacity-30' : 'bg-brand-red bg-opacity-20 text-brand-red border-brand-red border-opacity-30') : 'bg-gray-800 text-gray-400 border-gray-700';

                html += `
                    <tr class="hover:bg-gray-800 transition-colors border-b border-gray-800/50 group ${rowAnimationClass}">
                        <td class="px-3 sm:px-6 py-3 sm:py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="font-bold text-white text-sm sm:text-base dir-ltr">${item.baseAsset}</div>
                                <div class="text-[10px] sm:text-xs text-gray-500 mr-1 dir-ltr">/${TARGET_QUOTE_ASSET}</div>
                            </div>
                        </td>
                        <td class="px-3 sm:px-6 py-3 sm:py-4 whitespace-nowrap text-left font-mono font-medium text-gray-100 text-sm sm:text-base dir-ltr">
                            $${priceFormatted}
                        </td>
                        <td class="px-3 sm:px-6 py-3 sm:py-4 whitespace-nowrap text-left font-medium text-sm sm:text-base ${colorClass} dir-ltr">
                            <div class="flex items-center justify-end gap-1">
                                ${item.isBullish ? 
                                    '<svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>' : 
                                    '<svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>'
                                }
                                <span dir="ltr">${changeSign}${item.changePercent.toFixed(2)}%</span>
                            </div>
                        </td>
                        <td class="px-3 sm:px-6 py-3 sm:py-4 whitespace-nowrap text-left hidden sm:table-cell text-[10px] sm:text-xs text-gray-400 font-mono dir-ltr">
                            <div class="text-gray-300">H: $${formatPrice(item.high)}</div>
                            <div class="text-gray-500 mt-0.5">L: $${formatPrice(item.low)}</div>
                        </td>
                        <td class="px-3 sm:px-6 py-3 sm:py-4 whitespace-nowrap text-left hidden md:table-cell font-mono text-gray-300 text-sm sm:text-base dir-ltr">
                            $${formatNumberShort(item.volume)}
                        </td>
                        <td class="px-3 sm:px-6 py-3 sm:py-4 whitespace-nowrap text-center hidden lg:table-cell">
                            <span class="inline-flex items-center justify-center px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-md text-xs font-bold border ${scoreColorClass}">
                                ${item.trendScore.toFixed(1)}
                            </span>
                        </td>
                        <td class="px-3 sm:px-6 py-3 sm:py-4 whitespace-nowrap text-center">
                            <a href="https://www.binance.com/ar/trade/${item.symbol}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center px-2 sm:px-3 py-1 sm:py-1.5 border border-transparent text-[10px] sm:text-xs font-medium rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-gray-900 transition-colors opacity-100 lg:opacity-0 lg:group-hover:opacity-100">
                                تداول
                            </a>
                        </td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
        };

        // --- Event Listeners ---

        // Input events trigger re-render without fetching new data
        searchInput.addEventListener('input', renderTable);
        minVolumeSelect.addEventListener('change', renderTable);
        trendFilterSelect.addEventListener('change', renderTable);
        sortSelect.addEventListener('change', renderTable);
        strategySelect.addEventListener('change', renderTable); // Add listener for strategy

        // Reset filters button
        resetFiltersBtn.addEventListener('click', () => {
            searchInput.value = '';
            minVolumeSelect.value = '10000000'; // Reset to default > 10M
            trendFilterSelect.value = 'all';
            sortSelect.value = 'changeDesc';
            strategySelect.value = 'none'; // Reset strategy
            renderTable();
        });

        // Manual refresh button
        refreshBtn.addEventListener('click', () => {
            // Add a little spin animation to the button
            const svg = refreshBtn.querySelector('svg');
            svg.classList.add('animate-spin');
            
            fetchMarketData().then(() => {
                setTimeout(() => svg.classList.remove('animate-spin'), 500);
            });
            
            // Reset interval so we don't fetch immediately again
            clearInterval(updateInterval);
            updateInterval = setInterval(fetchMarketData, REFRESH_RATE_MS);
        });

        // --- Initialization ---
        const initApp = () => {
            // Initial fetch
            fetchMarketData();
            
            // Set up polling
            updateInterval = setInterval(fetchMarketData, REFRESH_RATE_MS);
            
            // Handle visibility change to save resources when tab is inactive
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    clearInterval(updateInterval);
                    setStatus('fetching');
                    statusText.innerText = "متوقف مؤقتاً";
                } else {
                    fetchMarketData(); // Fetch immediately on return
                    updateInterval = setInterval(fetchMarketData, REFRESH_RATE_MS);
                }
            });
        };

        // Start the app when DOM is ready
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
